name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  CGO_ENABLED: "0"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.13.2 }
  test:
    runs-on: ubuntu-latest
    env: { COVERAGE_THRESHOLD: "75" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: no-cgo build posture
        run: CGO_ENABLED=0 go build ./...
      - name: race tests + coverage
        run: CGO_ENABLED=1 go test -race -covermode=atomic -coverprofile=coverage.txt ./...
      - run: ./scripts/coverage-gate.sh
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
  nilaway-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260808063849-8649a03c818a ./... || true
