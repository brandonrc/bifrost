version: "2"
linters:
  default: standard
  enable:
    - exhaustive
    - depguard
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    depguard:
      rules:
        pure-domain:
          files: ["**/internal/core/**", "**/internal/policy/**"]
          deny:
            - pkg: "k8s.io"
              desc: "core/policy are k8s-free (predecessor ADR-0002)"
            - pkg: "sigs.k8s.io"
              desc: "core/policy are k8s-free (predecessor ADR-0002)"
            - pkg: "github.com/jackc/pgx"
              desc: "core/policy are I/O-free"
            - pkg: "database/sql"
              desc: "core/policy are I/O-free"
        controller-no-k8s:
          files: ["**/internal/controller/**"]
          deny:
            - pkg: "k8s.io"
              desc: "internal/controller talks only to the Provisioner interface and Store (Task 9); k8s-aware code belongs in internal/provision"
            - pkg: "sigs.k8s.io"
              desc: "internal/controller talks only to the Provisioner interface and Store (Task 9); k8s-aware code belongs in internal/provision"
        apitest-test-only:
          files: ["!$test"]
          deny:
            - pkg: "github.com/brandonrc/bifrost/internal/api/apitest"
              desc: "apitest is a dev-mode auth bypass (predecessor issue #45); import it only from _test.go files"
